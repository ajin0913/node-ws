<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统接入 // SYSTEM ACCESS</title>
    <style>
        /* --- 核心样式 --- */
        :root {
            --primary-color: #0f0; /* 终端绿 */
            --secondary-color: #003b00;
            --bg-color: #050505;
            --glitch-color: #f0f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 5px var(--primary-color);
        }

        /* --- CRT 屏幕效果容器 --- */
        .crt-container {
            width: 80%;
            max-width: 800px;
            height: 60vh;
            border: 2px solid var(--primary-color);
            padding: 40px;
            position: relative;
            background: rgba(0, 20, 0, 0.8);
            box-shadow: 0 0 20px var(--primary-color), inset 0 0 50px rgba(0,0,0,0.8);
        }

        /* --- 扫描线特效 --- */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            animation: scroll 10s linear infinite;
        }

        /* --- 头部状态栏 --- */
        .header {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px dashed var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* --- 主要内容区 --- */
        .content {
            font-size: 18px;
            line-height: 1.6;
            min-height: 150px;
        }

        /* --- 游戏风格按钮 --- */
        .btn-group {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }

        .game-btn {
            background: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 15px 30px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .game-btn:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--primary-color);
        }

        .game-btn:active {
            transform: scale(0.95);
        }

        /* --- 闪烁光标 --- */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: var(--primary-color);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        /* --- 动画定义 --- */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes scroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* 简单的故障文字效果 */
        .glitch-text:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            color: var(--glitch-color);
            border-color: var(--glitch-color);
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <div class="crt-container">
        <div class="scanlines"></div>
        
        <div class="header">
            <span>USER: GUEST_001</span>
            <span id="clock">TIME: 00:00:00</span>
            <span>STATUS: ONLINE</span>
        </div>

        <div class="content">
            <span id="typing-text"></span><span class="cursor"></span>
        </div>

        <div class="btn-group">
            <button class="game-btn glitch-text" onclick="alert('系统连接中... \nAccess Granted.')">开始任务</button>
            <button class="game-btn" onclick="document.body.style.filter = 'hue-rotate(90deg)'">切换主题</button>
        </div>
    </div>

    <script>
        // --- 1. 实时时钟 ---
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = 'TIME: ' + now.toLocaleTimeString('en-US', {hour12: false});
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- 2. 打字机效果脚本 ---
        const textToType = `正在初始化系统...
> 检查内存完整性... [OK]
> 加载神经连接协议... [OK]
> 
> 欢迎回来，玩家。
> 你的下一个任务已准备就绪。
> 请选择操作以继续...`;

        const typingElement = document.getElementById('typing-text');
        let index = 0;

        function typeWriter() {
            if (index < textToType.length) {
                // 处理换行符
                if (textToType.charAt(index) === '\n') {
                    typingElement.innerHTML += '<br>';
                } else {
                    typingElement.innerHTML += textToType.charAt(index);
                }
                index++;
                // 随机打字速度，模拟真实感
                setTimeout(typeWriter, Math.random() * 50 + 30);
            }
        }

        // 页面加载后延迟启动打字
        window.onload = () => {
            setTimeout(typeWriter, 800);
        };
    </script>
</body>
</html>
